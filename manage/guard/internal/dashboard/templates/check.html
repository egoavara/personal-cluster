{{define "check"}}{{template "layout" .}}{{end}}
{{define "content"}}
<h1>Permission Check</h1>
<div class="card">
<form method="POST" action="/check">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="form-group">
<label>Resource Type</label>
<select name="resource_type">
<option value="kube_service" {{if and .Query (eq (index .Query "resource_type") "kube_service")}}selected{{end}}>kube_service</option>
<option value="group" {{if and .Query (eq (index .Query "resource_type") "group")}}selected{{end}}>group</option>
</select>
</div>
<div class="form-group">
<label>Resource ID</label>
<input name="resource_id" placeholder="auth/guard-dashboard" value="{{if .Query}}{{index .Query "resource_id"}}{{end}}">
</div>
<div class="form-group">
<label>Permission</label>
<select name="permission">
<option value="view" {{if and .Query (eq (index .Query "permission") "view")}}selected{{end}}>view</option>
<option value="manage" {{if and .Query (eq (index .Query "permission") "manage")}}selected{{end}}>manage</option>
<option value="is_blocked" {{if and .Query (eq (index .Query "permission") "is_blocked")}}selected{{end}}>is_blocked</option>
<option value="is_member" {{if and .Query (eq (index .Query "permission") "is_member")}}selected{{end}}>is_member (group)</option>
</select>
</div>
<div class="form-group">
<label>Subject Type</label>
<select name="subject_type">
<option value="user" {{if and .Query (eq (index .Query "subject_type") "user")}}selected{{end}}>user</option>
<option value="group#member" {{if and .Query (eq (index .Query "subject_type") "group#member")}}selected{{end}}>group#member</option>
</select>
</div>
<div class="form-group" style="grid-column:span 2">
<label>Subject ID</label>
<input name="subject_id" placeholder="alice" value="{{if .Query}}{{index .Query "subject_id"}}{{end}}">
</div>
</div>
<button type="submit" class="btn" style="margin-top:12px">Check Permission</button>
</form>
</div>
{{if .Result}}
<div class="result {{if eq .Result "ALLOWED"}}result-allowed{{else if eq .Result "DENIED"}}result-denied{{else}}result-error{{end}}">
Result: {{.Result}}
</div>
{{end}}
{{end}}
