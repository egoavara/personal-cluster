{{define "check"}}{{template "layout" .}}{{end}}
{{define "content"}}
<h1>Permission Check</h1>
<div class="card">
<form method="POST" action="/check">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="form-group">
<label>Resource Type</label>
<select name="resource_type">
<option value="pod">pod</option>
<option value="service">service</option>
<option value="deployment">deployment</option>
<option value="namespace">namespace</option>
<option value="configmap">configmap</option>
<option value="secret">secret</option>
<option value="dashboard">dashboard</option>
</select>
</div>
<div class="form-group">
<label>Resource ID</label>
<input name="resource_id" placeholder="default/nginx" value="{{if .Query}}{{index .Query "resource_id"}}{{end}}">
</div>
<div class="form-group">
<label>Permission</label>
<select name="permission">
<option value="view">view</option>
<option value="access">access</option>
<option value="manage">manage</option>
</select>
</div>
<div class="form-group">
<label>Subject Type</label>
<select name="subject_type">
<option value="user">user</option>
<option value="serviceaccount">serviceaccount</option>
<option value="group">group</option>
</select>
</div>
<div class="form-group">
<label>Subject ID</label>
<input name="subject_id" placeholder="alice" value="{{if .Query}}{{index .Query "subject_id"}}{{end}}">
</div>
<div class="form-group">
<label>Client IP (optional)</label>
<input name="client_ip" placeholder="10.0.1.5" value="{{if .Query}}{{index .Query "client_ip"}}{{end}}">
</div>
</div>
<button type="submit" class="btn" style="margin-top:12px">Check Permission</button>
</form>
</div>
{{if .Result}}
<div class="result {{if eq .Result "ALLOWED"}}result-allowed{{else if eq .Result "DENIED"}}result-denied{{else}}result-error{{end}}">
Result: {{.Result}}
</div>
{{end}}
{{end}}
