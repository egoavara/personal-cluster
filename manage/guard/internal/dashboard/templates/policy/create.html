{{define "policy_create"}}{{template "layout" .}}{{end}}
{{define "content"}}
<h1>Create Policy</h1>
<div class="card">
<form method="POST" action="/policy/create">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="form-group">
<label>Resource Type</label>
<select name="resource_type">
<option value="kube_service">kube_service</option>
<option value="group">group</option>
</select>
</div>
<div class="form-group">
<label>Resource ID</label>
<input name="resource_id" placeholder="auth/guard-dashboard" required>
</div>
<div class="form-group">
<label>Relation</label>
<select name="relation">
<option value="viewer">viewer</option>
<option value="admin">admin</option>
<option value="blocked">blocked</option>
<option value="member">member (group)</option>
<option value="parent">parent (group)</option>
</select>
</div>
<div class="form-group">
<label>Subject Type</label>
<select name="subject_type">
<option value="user">user</option>
<option value="group#member">group#member</option>
</select>
</div>
<div class="form-group" style="grid-column:span 2">
<label>Subject ID</label>
<input name="subject_id" placeholder="alice" required>
</div>
</div>
<div style="margin-top:16px;display:flex;gap:12px">
<button type="submit" class="btn">Create</button>
<a href="/policy/" class="btn" style="background:#6c757d">Cancel</a>
</div>
</form>
</div>
{{end}}
