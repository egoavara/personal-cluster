<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 - Access Denied</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    max-width: 480px;
    padding: 2rem;
  }
  .icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    opacity: 0.6;
  }
  .code {
    font-size: 5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 1rem;
    color: #f1f5f9;
  }
  p {
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .meta {
    font-size: 0.8rem;
    color: #475569;
    margin-bottom: 2rem;
  }
  .meta span { display: block; margin: 0.25rem 0; }
  .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-block;
    padding: 0.6rem 1.5rem;
    border-radius: 0.5rem;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  a:hover { opacity: 0.85; }
  .btn-primary {
    background: #3b82f6;
    color: #fff;
  }
  .btn-secondary {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">&#x1f6e1;</div>
  <div class="code">403</div>
  <h1>Access Denied</h1>
  <p>You don't have permission to access <strong>{{.Host}}</strong>. Contact your administrator if you believe this is an error.</p>
  <div class="meta">
    <span>User: {{.User}}</span>
    <span>Resource: {{.Resource}}</span>
  </div>
  <div class="actions">
    <a href="{{.SignOutURL}}" class="btn-secondary">Sign Out</a>
    <a href="{{.RetryURL}}" class="btn-primary">Retry</a>
  </div>
</div>
</body>
</html>
